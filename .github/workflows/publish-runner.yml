name: Publish ORIN runner image

on:
  push:
    tags:
      - "orin-runner-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and publish immutable tags
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/orin-runner
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#orin-runner-v}"
          version_image="${IMAGE_NAME}:${version}"
          sha_image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker build \
            --file Dockerfile.runner \
            --build-arg "VERSION=${version}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "${version_image}" \
            --tag "${sha_image}" \
            .
          docker run --rm "${sha_image}" --help
          docker push "${version_image}"
          docker push "${sha_image}"
