name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orin-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/orin-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Test dashboard route bindings
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Test Sites package
        run: npm run test:sites

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests
        run: >-
          uv run --frozen pytest
          tests
          tools/shopify_publisher/orin/test_cron_reporting.py
          tools/shopify_publisher/orin/test_repository_reproducibility.py
      - name: Build and smoke-test runner image
        run: |
          docker build \
            --file Dockerfile.runner \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-runner:ci \
            .
          docker run --rm orin-runner:ci --help
          test "$(docker image inspect orin-runner:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Build and smoke-test control API image
        run: |
          docker build \
            --file Dockerfile.control-api \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-control-api:ci \
            .
          docker run --rm orin-control-api:ci \
            python -c "from orin_control.app import create_app; print('control-api-import-ok')"
          test "$(docker image inspect orin-control-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Build and smoke-test worker image
        run: |
          docker build \
            --file Dockerfile.worker \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-worker:ci \
            .
          docker run --rm orin-worker:ci --help
          docker run --rm --entrypoint python orin-worker:ci \
            -c 'from orin_worker.cli import build_parser; parsed = build_parser().parse_args(["serve", "--client-id", "hcs_gadgets"]); assert parsed.client_id == "hcs_gadgets"'
          test "$(docker image inspect orin-worker:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Build and smoke-test scheduler trigger image
        run: |
          docker build \
            --file Dockerfile.scheduler-trigger \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-scheduler-trigger:ci \
            .
          docker run --rm --entrypoint python orin-scheduler-trigger:ci \
            -c "from orin_scheduler_trigger.server import build_server; print('scheduler-trigger-import-ok')"
          test "$(docker image inspect orin-scheduler-trigger:ci --format '{{.Config.User}}')" = "10002:10002"
      - name: Build and smoke-test watchdog image
        run: |
          docker build \
            --file Dockerfile.watchdog \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-watchdog:ci \
            .
          docker run --rm orin-watchdog:ci --help
          test "$(docker image inspect orin-watchdog:ci --format '{{.Config.User}}')" = "10003:10003"
      - name: Build and smoke-test Prefect shadow image
        run: |
          docker build \
            --file Dockerfile.prefect-shadow \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-prefect-shadow:ci \
            .
          docker run --rm --entrypoint python orin-prefect-shadow:ci \
            -c "import prefect; from orin_prefect_shadow.flow import hbstore_shadow_flow; from orin_prefect_owner.flow import hbstore_daily_scheduler_flow, hbstore_owner_commissioning_flow; assert prefect.__version__ == '3.8.1'; print(hbstore_shadow_flow.name, hbstore_owner_commissioning_flow.name, hbstore_daily_scheduler_flow.name)"
          test "$(docker image inspect orin-prefect-shadow:ci --format '{{.Config.User}}')" = "10004:10004"
      - name: Validate disabled VPS deployment contract
        run: |
          bash -n deploy/vps/preflight.sh
          bash -n deploy/vps/install_watchdog_db_secret.sh
          bash -n deploy/vps/install_hcs_worker_db_secret.sh
          bash -n deploy/vps/build_hcs_worker.sh
          bash -n deploy/vps/watchdog_preflight.sh
          deployment_tmp="$(mktemp -d)"
          mkdir -p \
            "${deployment_tmp}/runtime" \
            "${deployment_tmp}/evidence" \
            "${deployment_tmp}/secrets" \
            "${deployment_tmp}/trigger-socket"
          touch \
            "${deployment_tmp}/secrets/watchdog_database_url" \
            "${deployment_tmp}/secrets/scheduler_database_url" \
            "${deployment_tmp}/secrets/control_database_url" \
            "${deployment_tmp}/secrets/worker_database_url" \
            "${deployment_tmp}/secrets/hoverboard_shopify_access_token"
          ORIN_DEPLOY_SHA="${GITHUB_SHA}" \
          ORIN_WATCHDOG_DEPLOY_SHA="${GITHUB_SHA}" \
          ORIN_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
          ORIN_RUNTIME_ROOT="${deployment_tmp}/runtime" \
          ORIN_EVIDENCE_ROOT="${deployment_tmp}/evidence" \
          ORIN_SECRETS_DIR="${deployment_tmp}/secrets" \
          ORIN_TRIGGER_SOCKET_DIR="${deployment_tmp}/trigger-socket" \
          ORIN_RUNTIME_UID=1000 \
          ORIN_RUNTIME_GID=1000 \
          ORIN_API_PORT=58080 \
            docker compose -f deploy/vps/compose.yml --profile "*" config --quiet
          test -z "$(ORIN_DEPLOY_SHA="${GITHUB_SHA}" \
            ORIN_WATCHDOG_DEPLOY_SHA="${GITHUB_SHA}" \
            ORIN_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            ORIN_RUNTIME_ROOT="${deployment_tmp}/runtime" \
            ORIN_EVIDENCE_ROOT="${deployment_tmp}/evidence" \
            ORIN_SECRETS_DIR="${deployment_tmp}/secrets" \
            ORIN_TRIGGER_SOCKET_DIR="${deployment_tmp}/trigger-socket" \
            ORIN_RUNTIME_UID=1000 \
            ORIN_RUNTIME_GID=1000 \
            ORIN_API_PORT=58080 \
              docker compose -f deploy/vps/compose.yml config --services)"
      - name: Validate disabled Prefect shadow deployment contract
        run: |
          bash -n deploy/prefect-shadow/entrypoint.sh
          bash -n deploy/prefect-shadow/install_server_secrets.sh
          bash -n deploy/prefect-shadow/install_shadow_db_secret.sh
          bash -n deploy/prefect-shadow/install_owner_db_secret.sh
          bash -n deploy/prefect-shadow/preflight.sh
          prefect_tmp="$(mktemp -d)"
          mkdir -p "${prefect_tmp}/secrets"
          touch \
            "${prefect_tmp}/secrets/prefect_postgres_password" \
            "${prefect_tmp}/secrets/prefect_server_database_password" \
            "${prefect_tmp}/secrets/prefect_api_auth" \
            "${prefect_tmp}/secrets/shadow_database_url" \
            "${prefect_tmp}/secrets/owner_database_url"
          ORIN_PREFECT_DEPLOY_SHA="${GITHUB_SHA}" \
          ORIN_PREFECT_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
          ORIN_PREFECT_SECRETS_DIR="${prefect_tmp}/secrets" \
          ORIN_PREFECT_UI_PORT=54200 \
            docker compose -f deploy/prefect-shadow/compose.yml \
              --profile "*" config --quiet
          test -z "$(ORIN_PREFECT_DEPLOY_SHA="${GITHUB_SHA}" \
            ORIN_PREFECT_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            ORIN_PREFECT_SECRETS_DIR="${prefect_tmp}/secrets" \
            ORIN_PREFECT_UI_PORT=54200 \
              docker compose -f deploy/prefect-shadow/compose.yml config --services)"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start local Supabase
        run: npx --yes supabase@2.109.1 start
      - name: Run database tests
        run: npx --yes supabase@2.109.1 test db --local
      - name: Lint database schema
        run: >-
          npx --yes supabase@2.109.1 db lint
          --local
          --schema public
          --level warning
          --fail-on error
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.109.1 stop --no-backup
