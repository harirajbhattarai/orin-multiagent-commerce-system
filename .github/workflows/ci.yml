name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests
        run: >-
          uv run --frozen pytest
          tests
          tools/shopify_publisher/orin/test_cron_reporting.py
          tools/shopify_publisher/orin/test_repository_reproducibility.py
      - name: Build and smoke-test runner image
        run: |
          docker build \
            --file Dockerfile.runner \
            --build-arg "VERSION=ci" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag orin-runner:ci \
            .
          docker run --rm orin-runner:ci --help
          test "$(docker image inspect orin-runner:ci --format '{{.Config.User}}')" = "10001:10001"
