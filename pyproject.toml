[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orin-runner"
version = "0.1.0"
description = "Deterministic, evidence-producing runner for ORIN client workflows"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
orin-runner = "orin_runner.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orin_runner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = true
required-version = "==0.11.16"
