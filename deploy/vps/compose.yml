name: orin-control

services:
  scheduler-trigger:
    profiles: ["scheduler-trigger"]
    image: local/orin-scheduler-trigger:${ORIN_DEPLOY_SHA:?set ORIN_DEPLOY_SHA}
    pull_policy: never
    build:
      context: ${ORIN_PROJECT_ROOT:?set ORIN_PROJECT_ROOT}
      dockerfile: Dockerfile.scheduler-trigger
      args:
        VERSION: ${ORIN_DEPLOY_SHA}
        VCS_REF: ${ORIN_DEPLOY_SHA}
    init: true
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 10s
    environment:
      ORIN_SCHEDULER_DATABASE_URL_FILE: /run/secrets/scheduler_database_url
      ORIN_SCHEDULER_DATABASE_ROLE: orin_scheduler
      ORIN_SCHEDULER_SOCKET_PATH: /run/orin/orin-hbstore-trigger.sock
    secrets:
      - scheduler_database_url
    volumes:
      - type: bind
        source: ${ORIN_TRIGGER_SOCKET_DIR:?set ORIN_TRIGGER_SOCKET_DIR}
        target: /run/orin
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,stat;
          mode=pathlib.Path('/run/orin/orin-hbstore-trigger.sock').stat().st_mode;
          assert stat.S_ISSOCK(mode)
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  control-api:
    profiles: ["manual-api"]
    image: local/orin-control-api:${ORIN_DEPLOY_SHA:?set ORIN_DEPLOY_SHA}
    pull_policy: never
    build:
      context: ${ORIN_PROJECT_ROOT:?set ORIN_PROJECT_ROOT}
      dockerfile: Dockerfile.control-api
      args:
        VERSION: ${ORIN_DEPLOY_SHA}
        VCS_REF: ${ORIN_DEPLOY_SHA}
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    restart: "no"
    stop_grace_period: 20s
    environment:
      ORIN_DATABASE_URL_FILE: /run/secrets/control_database_url
      ORIN_SUPABASE_URL: https://hgbpfkrenxfezaztwlkp.supabase.co
      ORIN_DATABASE_ROLE: orin_api
      ORIN_DB_POOL_SIZE: "1"
      ORIN_JWT_AUDIENCE: authenticated
      ORIN_JWT_ALGORITHM: ES256
    secrets:
      - control_database_url
    ports:
      - "127.0.0.1:${ORIN_API_PORT:-58080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    profiles: ["manual-worker"]
    image: local/orin-worker:${ORIN_DEPLOY_SHA:?set ORIN_DEPLOY_SHA}
    pull_policy: never
    build:
      context: ${ORIN_PROJECT_ROOT:?set ORIN_PROJECT_ROOT}
      dockerfile: Dockerfile.worker
      args:
        VERSION: ${ORIN_DEPLOY_SHA}
        VCS_REF: ${ORIN_DEPLOY_SHA}
    init: true
    user: "${ORIN_RUNTIME_UID:-1000}:${ORIN_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00
    restart: "no"
    stop_grace_period: 30s
    environment:
      ORIN_WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      ORIN_WORKER_DATABASE_ROLE: orin_worker
      ORIN_REPO_ROOT: /app
      ORIN_WORKSPACE_ROOT: /runtime
      HOVERBOARD_STORE_SHOPIFY_STORE_DOMAIN: 5a1679-88.myshopify.com
      HOVERBOARD_STORE_SHOPIFY_API_VERSION: "2026-07"
      HOVERBOARD_STORE_SHOPIFY_BLOG_ID: "113430790492"
      HOVERBOARD_STORE_SHOPIFY_ACCESS_TOKEN_FILE: /run/secrets/hoverboard_shopify_access_token
      ORIN_MODEL_WRITER_ENABLED: "${ORIN_MODEL_WRITER_ENABLED:-0}"
      ORIN_WRITER_API_KEY_FILE: /run/secrets/writer_api_key
      ORIN_WRITER_TIMEOUT_SECONDS: "240"
    secrets:
      - worker_database_url
      - hoverboard_shopify_access_token
      - writer_api_key
    volumes:
      - type: bind
        source: ${ORIN_RUNTIME_ROOT:?set ORIN_RUNTIME_ROOT}
        target: /runtime
        read_only: true
      - type: bind
        source: ${ORIN_EVIDENCE_ROOT:?set ORIN_EVIDENCE_ROOT}
        target: /evidence
    command:
      - once
      - --workspace-root
      - /runtime
      - --artifact-root
      - /evidence
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  scheduler_database_url:
    file: ${ORIN_SECRETS_DIR:?set ORIN_SECRETS_DIR}/scheduler_database_url
  control_database_url:
    file: ${ORIN_SECRETS_DIR:?set ORIN_SECRETS_DIR}/control_database_url
  worker_database_url:
    file: ${ORIN_SECRETS_DIR:?set ORIN_SECRETS_DIR}/worker_database_url
  hoverboard_shopify_access_token:
    file: ${ORIN_SECRETS_DIR:?set ORIN_SECRETS_DIR}/hoverboard_shopify_access_token
  writer_api_key:
    file: ${ORIN_SECRETS_DIR:?set ORIN_SECRETS_DIR}/writer_api_key
